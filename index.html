<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2e6a39">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stock phyto">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Stock phyto</title>
<style>
:root{
  --bg:#f3f5f0; --card:#fff; --ink:#1c2a1e; --muted:#5f6d61; --line:#dde3d9;
  --acc:#2e6a39; --acc-ink:#fff; --acc-soft:#e6f0e3;
  --out:#9a3412; --out-soft:#fdeee4;
  --warn:#a15c00; --warn-soft:#fff4dc;
  --bad:#b42318; --bad-soft:#fdecea;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:640px;margin:0 auto;padding:0 14px 40px}
.top{display:flex;align-items:center;gap:10px;padding:14px 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
.top .t{font-weight:700;font-size:18px;flex:1;display:flex;align-items:center;gap:8px}
.top .who{font-size:14px;color:var(--muted);text-align:right;line-height:1.2}
.top .who b{color:var(--ink)}
.homebtn{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;border:0;background:var(--acc);color:#fff;border-radius:12px;min-width:58px;height:46px;padding:2px 8px;font-size:11px;font-weight:700;box-shadow:0 1px 2px #0002;cursor:pointer}
.homebtn span{font-size:18px;line-height:1.1}
.back{border:0;background:var(--card);border-radius:50%;width:42px;height:42px;font-size:20px;box-shadow:0 1px 2px #0002;cursor:pointer;flex:none}
h1{font-size:24px;margin:8px 0 14px}
h2{font-size:17px;margin:22px 0 8px;color:var(--muted);font-weight:600}
p.muted,.muted{color:var(--muted)}
small{font-size:13px}
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 1px 2px #0001;margin-bottom:10px}
.big{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:14px 18px;border:0;border-radius:var(--r);background:var(--card);box-shadow:0 1px 3px #0002;font-size:19px;font-weight:600;text-align:left;cursor:pointer;margin-bottom:10px}
.big .ic{font-size:28px;width:36px;text-align:center;flex:none}
.big .sub{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.big.pri{background:var(--acc);color:var(--acc-ink)}
.big.pri .sub{color:#d9eadb}
.big.out{background:var(--out);color:#fff}
.big.out .sub{color:#fbd9c6}
.big.alert{background:var(--bad);color:#fff}
.big.blue{background:#1f5fa8;color:#fff}
.big.blue .sub{color:#d6e4f5}
.mapbox{border-radius:12px;overflow:hidden;background:#dde3d9;position:relative;z-index:0}
.vtx{background:#ffd400;border:2px solid #000;border-radius:50%}
.leaflet-tooltip.plabel{background:rgba(255,255,255,.85);border:0;box-shadow:none;font-weight:700;font-size:12px;padding:1px 5px}
.big.alert .sub{color:#fcd2cd}
.big:active{transform:scale(.99)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .big{margin:0;flex-direction:column;justify-content:center;text-align:center;min-height:96px;gap:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}
.btn.full{width:100%;min-height:60px;font-size:19px}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1;min-width:0}
label.f{display:block;font-weight:600;margin:14px 0 6px}
label.f small{font-weight:400;color:var(--muted)}
input.in,select.in,textarea.in{width:100%;min-height:52px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:18px}
input.in:focus,select.in:focus,textarea.in:focus{outline:none;border-color:var(--acc)}
.seg{display:flex;background:#e4e9e1;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:48px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:17px;cursor:pointer}
.seg button.on{background:#fff;box-shadow:0 1px 3px #0002;color:var(--acc)}
.stepper{display:flex;align-items:stretch;gap:8px}
.stepper button{width:72px;min-height:72px;border-radius:14px;border:0;background:var(--acc-soft);color:var(--acc);font-size:34px;font-weight:700;cursor:pointer}
.stepper input{flex:1;text-align:center;font-size:34px;font-weight:700;min-height:72px;border:1.5px solid var(--line);border-radius:14px;width:100%}
.calc{margin-top:8px;font-size:17px;color:var(--muted);min-height:24px}
.calc b{color:var(--ink)}
.search{position:relative}
.search input{padding-left:44px}
.search .mag{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5}
.list{background:var(--card);border-radius:var(--r);box-shadow:0 1px 2px #0001;overflow:hidden}
.it{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;min-height:64px}
.it:last-child{border-bottom:0}
.it .main{flex:1;min-width:0}
.it .nm{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.it .meta{font-size:13px;color:var(--muted)}
.it .qty{text-align:right;font-weight:700;font-size:18px;white-space:nowrap}
.it .qty small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.it.static{cursor:default}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--acc-soft);color:var(--acc);margin-left:6px;vertical-align:middle}
.badge.cmd{background:#e3ecfb;color:#1f4f99}
.badge.low{background:var(--warn-soft);color:var(--warn)}
.badge.neg{background:var(--bad-soft);color:var(--bad)}
.badge.in{background:var(--acc-soft);color:var(--acc)}
.badge.out{background:var(--out-soft);color:var(--out)}
.badge.adj{background:#eee;color:#555}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.note{border-radius:12px;padding:12px 14px;margin:10px 0;font-size:15px}
.note.warn{background:var(--warn-soft);color:#6b3d00}
.note.bad{background:var(--bad-soft);color:#7a1810}
.note.ok{background:var(--acc-soft);color:#1d4a26}
.note.info{background:#e9eef7;color:#203a66}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px;margin:18px auto}
.keypad button{min-height:68px;border-radius:16px;border:0;background:var(--card);box-shadow:0 1px 3px #0002;font-size:28px;font-weight:600;cursor:pointer}
.keypad button.ok{background:var(--acc);color:#fff;font-size:20px}
.dots{display:flex;justify-content:center;gap:14px;margin:16px 0;min-height:22px}
.dots span{width:18px;height:18px;border-radius:50%;background:#cfd6cc}
.dots span.on{background:var(--ink)}
.center{text-align:center}
.spin{width:36px;height:36px;border:4px solid #cfd6cc;border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:60px auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;width:calc(100% - 28px);max-width:600px;pointer-events:none}
#toast .ms{background:var(--ink);color:#fff;padding:14px 16px;border-radius:12px;margin-top:8px;box-shadow:0 4px 16px #0003;font-weight:600;animation:tin .2s}
#toast .ms.err{background:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#modal .bk{position:fixed;inset:0;background:#0006;z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:14px}
#modal .bx{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:520px;margin-bottom:max(0px,env(safe-area-inset-bottom))}
#modal .bx h3{margin:0 0 8px;font-size:20px}
#modal .acts{display:flex;gap:10px;margin-top:16px}
#modal .acts .btn{flex:1}
.done{text-align:center;padding:30px 0 10px}
.done .ck{font-size:64px;line-height:1}
.hr{height:1px;background:var(--line);margin:18px 0}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.tog input{width:26px;height:26px;accent-color:var(--acc)}
.foot{margin-top:28px;text-align:center}
.link{background:none;border:0;color:var(--acc);font-weight:600;padding:10px;cursor:pointer;text-decoration:underline}
.err{color:var(--bad);font-weight:600;font-size:14px;margin-top:6px}

/* État imprimable */
.sheet{background:#fff;border-radius:var(--r);padding:18px;box-shadow:0 1px 2px #0001;margin-top:10px;font-size:14px;color:#000}
.sh-head{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:6px}
.sh-title{font-size:19px;font-weight:800}
.sh-sum{text-align:right;white-space:nowrap}
.sheet h3{font-size:15px;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.03em}
table.sh{width:100%;border-collapse:collapse}
table.sh th,table.sh td{border:1px solid #999;padding:5px 6px;text-align:left;vertical-align:top}
table.sh th{background:#eee;font-size:12px}
table.sh td.r,table.sh th.r{text-align:right;white-space:nowrap}
table.sh tr.ban td{background:#fde2df}
table.sh small{color:#444}
.sh-foot{margin-top:14px;font-size:11px;color:#333}
.sh-sign{display:flex;gap:40px;margin-top:22px;font-size:13px}
.sh-sign div{flex:1;border-bottom:1px solid #000;padding-bottom:28px}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff}
  #app{max-width:none;padding:0}
  .noprint,#toast,#modal{display:none!important}
  .sheet{box-shadow:none;padding:0;margin:0;border-radius:0;font-size:10pt}
  table.sh{font-size:9pt}
  table.sh tr{break-inside:avoid}
  table.sh thead{display:table-header-group}
  table.sh tr.ban td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.sh th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:520px){ .sheet{padding:10px;font-size:12px} table.sh th,table.sh td{padding:4px} }

.ordre .ob{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.ordre .ob-l{flex:none;width:118px;font-weight:700;color:var(--muted);font-size:15px;padding-top:2px}
.ordre .ob-v{flex:1;font-size:20px;font-weight:700;line-height:1.3}
.ordre .ob-v small{font-size:14px;font-weight:400;color:var(--muted)}
.ordre .ob-t{font-size:17px;font-weight:800;margin:14px 0 6px}
table.obt td{font-size:20px;font-weight:700;padding:10px 8px}
table.obt td small{font-weight:400}
table.obt td.r{font-size:24px;white-space:nowrap}
@media print{ .ordre .ob-v{font-size:14pt} table.obt td{font-size:13pt} table.obt td.r{font-size:15pt} details{display:none} }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<input type="file" id="camfile" accept="image/*" capture="environment" hidden>
<script src="config.js"></script>
<script>
/* Configuration : lue dans le fichier config.js (voir LISEZMOI). */
const CFG = window.STOCK_PHYTO_CONFIG || {};
const SUPABASE_URL = String(CFG.url || "https://VOTRE-PROJET.supabase.co").trim().replace(/\/+$/, "").replace(/\/rest\/v1$/, "");
const SUPABASE_KEY = String(CFG.key || "VOTRE-CLE-PUBLIQUE").trim();
const POLL_MS = 8000;

/* ===================== Utilitaires ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const today = () => { const d = new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const fmtDate = s => { if (!s) return ""; const [y,m,d] = String(s).slice(0,10).split("-"); return d+"/"+m+"/"+y; };
const fmtD = n => (Math.round((+n || 0) * 10000) / 10000).toLocaleString("fr-FR", { maximumFractionDigits: 4 });
const fmtN = n => (Math.round((+n || 0) * 100) / 100).toLocaleString("fr-FR", {maximumFractionDigits: 2});
/* Taux de remplissage : part de la surface réellement plantée (rangs manquants). Surface utile = surface × taux. */
const pTaux = p => { const t = +((p || {}).taux); return t > 0 && t <= 100 ? t : 100; };
const pEff = p => Math.round((+((p || {}).surface) || 0) * pTaux(p) / 100 * 10000) / 10000;
const surfTxt = p => pTaux(p) < 100 ? fmtN(pEff(p)) + ' ha <small style="font-weight:400" class="muted">(' + fmtN(pTaux(p)) + " %)</small>" : fmtN(pEff(p)) + " ha";
const parseN = s => { const v = parseFloat(String(s ?? "").replace(/\s/g,"").replace(",", ".")); return isFinite(v) ? v : NaN; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const isCode = s => /^\d{8,14}$/.test(String(s).trim());
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

/* ===================== Serveur (Supabase) ===================== */
const CONFIGURED = /^https:\/\/.+/.test(SUPABASE_URL) && !SUPABASE_URL.includes("VOTRE-PROJET") && SUPABASE_KEY && !SUPABASE_KEY.includes("VOTRE-CLE") && !SUPABASE_KEY.includes("COLLEZ-ICI");
class ApiError extends Error { constructor(m, kind) { super(m); this.kind = kind || ""; } }
async function api(fn, args = {}) {
  let r;
  try {
    r = await fetch(SUPABASE_URL.replace(/\/+$/, "") + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify(args)
    });
  } catch (e) { throw new ApiError("Pas de connexion au serveur. Vérifiez le réseau.", "net"); }
  const t = await r.text();
  let j = null; try { j = t ? JSON.parse(t) : null; } catch (e) {}
  if (!r.ok) {
    const msg = (j && (j.message || j.msg || j.error_description || j.error)) || ("Erreur serveur (" + r.status + ")");
    if (msg === "SESSION") { sessionLost(); throw new ApiError("Session expirée : reconnectez-vous.", "session"); }
    if (r.status === 401 || r.status === 403) throw new ApiError("Clé d'accès Supabase refusée : vérifiez la configuration.", "config");
    if (r.status === 404) throw new ApiError("Fonction introuvable sur le serveur : le script SQL a-t-il bien été exécuté ?", "config");
    throw new ApiError(msg);
  }
  return j;
}

/* ===================== État ===================== */
const S = {
  token: store.get("phyto.token"), version: null, me: null,
  users: {}, produits: {}, mouvements: {}, alertes: {}, loginUsers: [], setup: false,
  view: "loading", f: {}, busy: false, offline: false, bootErr: ""
};
const ROLE = { decideur: "Décideur", applicateur: "Applicateur" };
const isDec = () => S.me && S.me.role === "decideur";
const meDoc = () => S.me;
const canAdmin = () => !!(S.me && S.me.isAdmin);

/* ===================== Données ===================== */
function stocks() { const m = {}; for (const [id, p] of Object.entries(S.produits)) m[id] = +p.stock || 0; return m; }
const U = p => (p && p.unite) || "L";
/* Contenant du produit : bidon, sac ou boîte */
const CTN = { bidon: ["bidon", "bidons"], sac: ["sac", "sacs"], boite: ["boîte", "boîtes"], paquet: ["paquet", "paquets"] };
const isDiff = p => !!p && (p.unite === "diffuseurs");
const ctw = (p, n) => { const c = CTN[(p && p.contenant)] || CTN.bidon; return (n !== undefined && Math.abs(n) >= 2) ? c[1] : c[0]; };
const ctP = p => (CTN[(p && p.contenant)] || CTN.bidon)[1];
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const fem = p => p && p.contenant === "boite";  // « une boîte entamée / pleine »
const bidonsTxt = (p, q) => (p && +p.contenance > 0) ? "≈ " + fmtN(q / p.contenance) + " " + ctw(p, q / p.contenance) + " de " + fmtN(p.contenance) + " " + U(p) : "";
const activeProducts = () => Object.entries(S.produits).filter(([, p]) => p && p.actif !== false).sort((a, b) => norm(a[1].nom).localeCompare(norm(b[1].nom)));
const byEan = code => { code = String(code).trim(); const e = Object.entries(S.produits).find(([, p]) => p && p.actif !== false && (p.eans || []).includes(code)); return e ? e[0] : null; };
const openAlerts = () => Object.entries(S.alertes).filter(([, a]) => a && !a.resolu).sort((a, b) => String(b[1].createdAt).localeCompare(String(a[1].createdAt)));
const openOrders = () => activeProducts().filter(([, p]) => p.commande && p.commande.enCours);
const isLow = (p, q) => q < 0 || (+p.seuil > 0 && q <= +p.seuil);

/* ---- Statut réglementaire (E-Phy) ---- */
const daysUntil = d => Math.round((new Date(d + "T12:00:00") - new Date(today() + "T12:00:00")) / 86400000);
const REG_SOON = 30, REG_WARN = 180;
function regStatus(p) {
  if (!p || !String(p.amm || "").trim()) return { k: "noamm" };
  const e = p.ephy;
  if (!e) return { k: "unknown" };
  const fu = e.finUtilisation, fd = e.finDistribution;
  const ufut = (e.usagesFin || []).filter(u => u.finUtilisation && u.finUtilisation >= today());
  if (fu) {
    const d = daysUntil(fu);
    if (d < 0) return { k: "banned", date: fu, days: d, e };
    return { k: d <= REG_SOON ? "soon" : d <= REG_WARN ? "warn" : "ending", date: fu, days: d, fd, e };
  }
  if (/retir/i.test(e.etat || "")) return { k: "retire", e };
  return { k: "ok", e, usages: ufut };
}
const isBanned = p => regStatus(p).k === "banned";
function regBadge(p) {
  const r = regStatus(p);
  if (r.k === "banned") return '<span class="badge neg">Interdit</span>';
  if (r.k === "soon" || r.k === "warn") return '<span class="badge low">Fin le ' + fmtDate(r.date) + "</span>";
  if (r.k === "ending") return '<span class="badge adj">Fin le ' + fmtDate(r.date) + "</span>";
  if (r.k === "retire") return '<span class="badge low">Retiré</span>';
  return "";
}
/* Liste des points réglementaires à surveiller, pour les décideurs */
function regIssues() {
  const st = stocks(), out = [];
  for (const [id, p] of activeProducts()) {
    const r = regStatus(p), q = st[id] || 0;
    if (r.k === "banned") out.push({ id, p, lvl: q > 0 ? 3 : 1, txt: "Utilisation interdite depuis le " + fmtDate(r.date) + (q > 0 ? " — " + fmtN(q) + " " + U(p) + " en stock à éliminer (PPNU)" : "") });
    else if (r.k === "soon" || r.k === "warn" || r.k === "ending") out.push({ id, p, lvl: r.k === "soon" ? 3 : r.k === "warn" ? 2 : 1, txt: "Fin d'utilisation le " + fmtDate(r.date) + " (dans " + r.days + " j)" + (r.fd ? " · fin de distribution le " + fmtDate(r.fd) : "") + (q > 0 ? " · stock : " + fmtN(q) + " " + U(p) : "") });
    else if (r.k === "retire") out.push({ id, p, lvl: 2, txt: "AMM retirée (" + r.e.etat + ") — vérifier les délais sur E-Phy" });
    else if (r.k === "ok" && r.usages.length) {
      const u = r.usages[0];
      out.push({ id, p, lvl: daysUntil(u.finUtilisation) <= REG_WARN ? 2 : 1, txt: r.usages.length + " usage(s) en fin d'utilisation, dont « " + u.usage + " » le " + fmtDate(u.finUtilisation) });
    }
    else if (r.k === "unknown") out.push({ id, p, lvl: 0, txt: "N° AMM « " + p.amm + " » introuvable dans E-Phy — à vérifier" });
    if (p.commande && p.commande.enCours && r.fd && r.fd < today()) out.push({ id, p, lvl: 3, txt: "Commande en cours alors que la distribution est arrêtée depuis le " + fmtDate(r.fd) });
  }
  return out.sort((a, b) => b.lvl - a.lvl || norm(a.p.nom).localeCompare(norm(b.p.nom)));
}
const regUrgent = () => regIssues().filter(i => i.lvl >= 2).length;

function applyState(st) {
  S.version = st.version; S.me = st.me; S.ephyMaj = st.ephyMaj || null; S.ephyInfo = st.ephyInfo || ""; S.siret = st.siret || "";
  S.produits = st.produits || {}; S.mouvements = st.mouvements || {}; S.alertes = st.alertes || {}; S.users = st.users || {};
  S.demandes = st.demandes || {}; S.parcelles = st.parcelles || {}; S.pulves = st.pulves || {}; S.traitements = st.traitements || {}; S.entreprises = st.entreprises || {}; S.cmdLibres = st.commandesLibres || {};
}
async function reload() {
  const st = await api("get_state", { p_token: S.token });
  applyState(st); S.offline = false; onData();
}
async function poll() {
  if (!S.token || !S.me || document.hidden || S.busy) return;
  try {
    const v = await api("get_version", { p_token: S.token });
    if (S.offline) { S.offline = false; onData(); }
    if (v !== S.version) await reload();
  } catch (e) { if (e.kind === "net" && !S.offline) { S.offline = true; onData(); } }
}
setInterval(poll, POLL_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
window.addEventListener("online", poll);

function sessionLost() {
  if (!S.token) return;
  S.token = null; store.del("phyto.token"); S.me = null;
  toast("Session terminée : reconnectez-vous.", "err");
  showLogin();
}
async function showLogin() {
  go("loading");
  try {
    S.setup = await api("needs_setup");
    S.loginUsers = S.setup ? [] : await api("list_login_users");
    S.bootErr = "";
    go(S.setup ? "setup" : "login");
  } catch (e) { S.bootErr = e.message; go("loading"); }
}
async function boot() {
  if (!CONFIGURED) return go("config");
  if (S.token) {
    try { await reload(); return go("home"); }
    catch (e) {
      if (e.kind === "net") { S.bootErr = e.message; return go("loading"); }
      S.token = null; store.del("phyto.token");
    }
  }
  showLogin();
}
async function startSession(token) {
  S.token = token; store.set("phyto.token", token);
  await reload(); go("home");
}
async function logout() {
  const t = S.token; S.token = null; S.me = null; store.del("phyto.token");
  if (t) api("logout", { p_token: t }).catch(() => {});
  showLogin();
}
function onData() {
  const live = VIEWS[S.view] && VIEWS[S.view].live;
  if (live === true) render();
  else if (typeof live === "function") live();
  const ob = $("#offline"); if (ob) ob.hidden = !S.offline;
}
/* Appel d'écriture : envoie, recharge l'état, gère les erreurs */
async function act(fn, args, okMsg) {
  if (S.busy) return null;
  S.busy = true;
  try {
    const r = await api(fn, { p_token: S.token, ...args });
    try { await reload(); } catch (e) {}
    if (okMsg) toast(okMsg);
    return { r };
  } catch (e) {
    if (e.kind !== "session") toast(e.message, "err", 6000);
    return null;
  } finally { S.busy = false; }
}

/* ===================== Interface : outils ===================== */
function toast(msg, kind = "", ms = 3200) {
  const el = document.createElement("div");
  el.className = "ms " + kind; el.textContent = msg;
  const t = $("#toast"); while (t.children.length >= 2) t.firstChild.remove();
  t.appendChild(el);
  setTimeout(() => el.remove(), ms);
}
function modal(html) {
  return new Promise(resolve => {
    const m = $("#modal");
    m.innerHTML = '<div class="bk"><div class="bx">' + html + "</div></div>";
    const close = v => { m.innerHTML = ""; resolve(v); };
    m.querySelector(".bk").addEventListener("click", e => {
      if (e.target.classList.contains("bk")) return close(null);
      const b = e.target.closest("[data-m]");
      if (!b) return;
      const v = b.dataset.m;
      if (v === "cancel") return close(null);
      const inp = m.querySelector("[data-mi]");
      close({ v, input: inp ? inp.value : undefined });
    });
    const inp = m.querySelector("[data-mi]"); if (inp) setTimeout(() => inp.focus(), 50);
  });
}

/* ===================== Code-barre ===================== */
let zxingP = null;
function loadZXing() {
  if (window.ZXing) return Promise.resolve();
  if (!zxingP) zxingP = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
    s.onload = res; s.onerror = () => { zxingP = null; rej(new Error("lecteur indisponible")); };
    document.head.appendChild(s);
  });
  return zxingP;
}
function zxHints() {
  const h = new Map(); h.set(ZXing.DecodeHintType.TRY_HARDER, true);
  const F = ZXing.BarcodeFormat;
  h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF, F.QR_CODE, F.DATA_MATRIX]);
  return h;
}
async function decodeImage(file) {
  const bmp = await createImageBitmap(file);
  if ("BarcodeDetector" in window) {
    try { const r = await new BarcodeDetector().detect(bmp); if (r && r.length) return r[0].rawValue; } catch (e) {}
  }
  const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  await loadZXing();
  const res = await new ZXing.BrowserMultiFormatReader(zxHints()).decodeFromImageUrl(c.toDataURL("image/jpeg", 0.92));
  return res.getText();
}
let camCb = null, liveReader = null;
function stopLive() { try { if (liveReader) liveReader.reset(); } catch (e) {} liveReader = null; $("#modal").innerHTML = ""; }
function photoScan() { const i = $("#camfile"); i.value = ""; i.click(); }
function gotCode(code) {
  const cb = camCb; camCb = null; stopLive();
  try { if (navigator.vibrate) navigator.vibrate(80); } catch (e) {}
  if (cb) cb(String(code).trim());
}
async function scan(cb) {
  camCb = cb;
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return photoScan();
  $("#modal").innerHTML = '<div class="bk"><div class="bx"><h3>Scanner le code-barre</h3>' +
    '<div style="position:relative"><video id="cam" playsinline muted autoplay style="width:100%;border-radius:12px;background:#000;aspect-ratio:4/3;object-fit:cover;display:block"></video>' +
    '<div style="position:absolute;left:10%;right:10%;top:38%;height:24%;border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 999px #0005;pointer-events:none"></div></div>' +
    '<p class="muted" id="camtxt">Placez le code-barre dans le cadre, à 15–20 cm.</p>' +
    '<div class="acts"><button class="btn" id="camx">Annuler</button><button class="btn" id="camph">📷 Prendre une photo</button></div></div></div>';
  $("#camx").onclick = () => { camCb = null; stopLive(); };
  $("#camph").onclick = () => { stopLive(); photoScan(); };
  try {
    await loadZXing();
    if (!camCb || !$("#cam")) return;
    liveReader = new ZXing.BrowserMultiFormatReader(zxHints(), 250);
    await liveReader.decodeFromConstraints({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } } }, $("#cam"), (res) => { if (res && camCb) gotCode(res.getText()); });
  } catch (e) {
    stopLive();
    if (camCb) { toast("Caméra indisponible : prenez une photo du code-barre.", "err", 4000); photoScan(); }
  }
}
$("#camfile").addEventListener("change", async e => {
  const file = e.target.files && e.target.files[0];
  if (!file || !camCb) return;
  toast("Lecture du code-barre…");
  try { const code = await decodeImage(file); if (!code) throw 0; gotCode(code); }
  catch (err) { toast("Code-barre illisible. Reprenez la photo bien nette, ou cherchez par le nom.", "err", 5000); }
});

});

  S.f.err = "";

  else if (k === "ok") return tryLogin();
  else if ((S.f.code || "").length < 6) S.f.code = (S.f.code || "") + k;
  render();
}

function handleBarcode(code) {

      .then(r => {

async function pickProduct(pid) {

function qtyCalc() {

function ephyProg(html, kind = "info") { const el = $("#eph_prog"); if (el) el.innerHTML = '<div class="note ' + kind + '">' + html + "</div>"; }
let libsP = null;
function loadLibs() {
  const one = src => new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Bibliothèque non chargée : " + src)); document.head.appendChild(s); });
  if (!libsP) libsP = Promise.all([window.JSZip ? 0 : one("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"),
                                   window.Papa ? 0 : one("https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js")]).catch(e => { libsP = null; throw e; });
  return libsP;
}
async function ephyAuto() {
  if (S.busy) return;
  ephyProg("Téléchargement depuis data.gouv.fr…");
  let blob = null, lastErr = "";
  for (const url of EPHY_ZIPS) {
    try { const r = await fetch(url); if (!r.ok) throw new Error("HTTP " + r.status); blob = await r.blob(); break; }
    catch (e) { lastErr = e.message; }
  }
  if (!blob) return ephyProg("Téléchargement automatique impossible depuis le navigateur (" + esc(lastErr) + "). Utilisez la méthode manuelle ci-dessous.", "warn");
  ephyImport(blob);
}
function decodeText(u8) {
  try { return new TextDecoder("utf-8", { fatal: true }).decode(u8); }
  catch (e) { return new TextDecoder("windows-1252").decode(u8); }
}
function parseDateFr(v) {
  v = String(v || "").trim(); let m;
  if ((m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return m[3] + "-" + pad(m[2]) + "-" + pad(m[1]);
  if ((m = v.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[1] + "-" + m[2] + "-" + m[3];
  return null;
}
const hnorm = h => norm(h).replace(/[^a-z0-9]+/g, " ").trim();
const findCol = (headers, test) => headers.findIndex(h => test(hnorm(h)));
function colsOf(headers) {
  const c = {
    amm: findCol(headers, h => /\bamm\b/.test(h) && !/reference/.test(h)),
    nom: findCol(headers, h => /^nom (du )?produit$/.test(h) || h === "nom commercial"),
    seconds: findCol(headers, h => /seconds? noms?/.test(h)),
    titulaire: findCol(headers, h => /titulaire/.test(h)),
    type: findCol(headers, h => /^type (de )?produit$/.test(h)),
    etat: findCol(headers, h => /^etat/.test(h) && !/usage/.test(h)),
    etatUsage: findCol(headers, h => /^etat/.test(h) && /usage/.test(h)),
    retrait: findCol(headers, h => /retrait/.test(h)),
    finDist: findCol(headers, h => /fin/.test(h) && /distribution/.test(h)),
    finUtil: findCol(headers, h => /fin/.test(h) && /utilisation/.test(h)),
    usage: findCol(headers, h => /identifiant usage lib/.test(h)),
    usage2: findCol(headers, h => /^identifiant usage$/.test(h) || /^usage$/.test(h) || /libelle usage/.test(h))
  };
  if (c.usage < 0) c.usage = c.usage2;
  return c;
}
function parseCsv(text) {
  const nl = text.indexOf("\n"), first = text.slice(0, nl > 0 ? nl : 2000);
  const delim = (first.split(";").length >= first.split(",").length) ? ";" : ",";
  const r = Papa.parse(text, { delimiter: delim, skipEmptyLines: true });
  return { headers: (r.data[0] || []).map(h => String(h).replace(/^﻿/, "").trim()), rows: r.data.slice(1) };
}
async function ephyImport(fileOrBlob) {
  if (S.busy) return;
  S.busy = true;
  const btn = $("#eph_auto"); if (btn) btn.disabled = true;
  try {
    ephyProg("Chargement des outils de lecture…");
    await loadLibs();
    ephyProg("Ouverture de l'archive…");
    const zip = await JSZip.loadAsync(fileOrBlob);
    const names = Object.keys(zip.files).filter(n => !zip.files[n].dir && /\.csv$/i.test(n));
    if (!names.length) throw new Error("Aucun fichier CSV dans cette archive. Choisissez l'archive « decisionamm-intrant-format-csv » (pas le XML).");
    const base = n => n.split("/").pop().toLowerCase();
    const prodName = names.find(n => /^produits?([_ -](utf-?8|windows.*|win.*))?\.csv$/i.test(base(n)))
      || names.find(n => /produit/i.test(base(n)) && !/usage|substance|phrase|condition|mfsc|melange|mixte|permis|classe|fonction/i.test(base(n)));
    const usgName = names.find(n => /^produits?_usages/i.test(base(n))) || names.find(n => /usage/i.test(base(n)) && /produit/i.test(base(n)));
    if (!prodName && !usgName) throw new Error("Fichiers des produits introuvables dans l'archive (" + names.map(base).join(", ") + ").");
    const recs = new Map(), diag = [];
    const getRec = amm => {
      const k = String(amm || "").replace(/[^0-9A-Za-z]/g, "").toUpperCase(); if (!k) return null;
      if (!recs.has(k)) recs.set(k, { amm: k, nom: "", seconds_noms: "", titulaire: "", type_produit: "", etat: "", date_retrait: null, fin_distribution: null, fin_utilisation: null, _ufd: null, _ufu: null, _us: new Map() });
      return recs.get(k);
    };
    const maxD = (a, b) => (!a ? b : !b ? a : a > b ? a : b);
    if (prodName) {
      ephyProg("Lecture de la liste des produits…");
      const { headers, rows } = parseCsv(decodeText(await zip.file(prodName).async("uint8array")));
      const c = colsOf(headers);
      diag.push(base(prodName) + " : " + rows.length + " lignes");
      if (c.amm < 0) throw new Error("Colonne « numéro AMM » introuvable dans " + base(prodName) + ". Colonnes : " + headers.join(" | "));
      for (const r of rows) {
        const rec = getRec(r[c.amm]); if (!rec) continue;
        if (c.nom >= 0 && r[c.nom]) rec.nom = r[c.nom].trim();
        if (c.seconds >= 0 && r[c.seconds]) rec.seconds_noms = r[c.seconds].trim();
        if (c.titulaire >= 0 && r[c.titulaire]) rec.titulaire = r[c.titulaire].trim();
        if (c.type >= 0 && r[c.type]) rec.type_produit = r[c.type].trim();
        if (c.etat >= 0 && r[c.etat]) rec.etat = r[c.etat].trim();
        if (c.retrait >= 0) rec.date_retrait = maxD(rec.date_retrait, parseDateFr(r[c.retrait]));
        if (c.finDist >= 0) rec.fin_distribution = maxD(rec.fin_distribution, parseDateFr(r[c.finDist]));
        if (c.finUtil >= 0) rec.fin_utilisation = maxD(rec.fin_utilisation, parseDateFr(r[c.finUtil]));
      }
    }
    if (usgName) {
      ephyProg("Lecture des usages (le plus long fichier)…");
      await sleep(30);
      const { headers, rows } = parseCsv(decodeText(await zip.file(usgName).async("uint8array")));
      const c = colsOf(headers);
      diag.push(base(usgName) + " : " + rows.length + " lignes");
      if (c.amm >= 0) {
        const limit = new Date(Date.now() - 2 * 365 * 86400000).toISOString().slice(0, 10);
        for (const r of rows) {
          const rec = getRec(r[c.amm]); if (!rec) continue;
          if (!rec.nom && c.nom >= 0 && r[c.nom]) rec.nom = r[c.nom].trim();
          if (!rec.etat && c.etat >= 0 && r[c.etat]) rec.etat = r[c.etat].trim();
          const fd = c.finDist >= 0 ? parseDateFr(r[c.finDist]) : null, fu = c.finUtil >= 0 ? parseDateFr(r[c.finUtil]) : null;
          rec._ufd = maxD(rec._ufd, fd); rec._ufu = maxD(rec._ufu, fu);
          if (fu && fu >= limit && c.usage >= 0) {
            const lab = String(r[c.usage] || "").trim().slice(0, 160);
            if (lab && !rec._us.has(lab)) rec._us.set(lab, { usage: lab, finDistribution: fd, finUtilisation: fu, etat: c.etatUsage >= 0 ? String(r[c.etatUsage] || "").trim() : "" });
          }
        }
      } else diag.push("(colonne AMM absente des usages : dates par usage ignorées)");
    }
    /* Synthèse : un produit retiré prend la date de fin la plus tardive de ses usages */
    const out = [];
    let nFin = 0;
    for (const rec of recs.values()) {
      const retire = /retir/i.test(rec.etat);
      if (retire || !prodName) {
        if (!rec.fin_utilisation && rec._ufu) rec.fin_utilisation = rec._ufu;
        if (!rec.fin_distribution && rec._ufd) rec.fin_distribution = rec._ufd;
      }
      if (rec.fin_utilisation) nFin++;
      const us = [...rec._us.values()].sort((a, b) => a.finUtilisation.localeCompare(b.finUtilisation)).slice(0, 40);
      out.push({ amm: rec.amm, nom: rec.nom, seconds_noms: rec.seconds_noms, titulaire: rec.titulaire, type_produit: rec.type_produit, etat: rec.etat,
        date_retrait: rec.date_retrait, fin_distribution: rec.fin_distribution, fin_utilisation: rec.fin_utilisation, usages_fin: us });
    }
    if (!out.length) throw new Error("Aucun produit lu (" + diag.join(" ; ") + ").");
    const info = out.length + " produits, dont " + nFin + " avec une date de fin d'utilisation";
    const CH = 800;
    for (let i = 0; i < out.length; i += CH) {
      ephyProg("Envoi vers la base : " + Math.min(i + CH, out.length) + " / " + out.length + "…");
      await api("ephy_import", { p_token: S.token, p_rows: out.slice(i, i + CH), p_last: i + CH >= out.length, p_info: info });
    }
    S.busy = false;
    await reload();
    render();
    const withAmm = activeProducts().filter(([, p]) => String(p.amm || "").trim());
    const found = withAmm.filter(([, p]) => p.ephy).length;
    ephyProg("✅ Import terminé : " + esc(info) + ".<br>Vos produits reconnus : <b>" + found + " / " + withAmm.length + "</b> (parmi ceux qui ont un n° AMM).<br><small>" + esc(diag.join(" · ")) + "</small>", "ok");
  } catch (e) {
    ephyProg("❌ " + esc(e.message || String(e)), "bad");
  } finally { S.busy = false; const b = $("#eph_auto"); if (b) b.disabled = false; }
}

/* Un comptage : { mode: "bidons" | "direct", full: n, open: [pourcentages], direct: "texte", done: bool } */
const invKey = () => S.f.req ? INV_KEY + "." + S.f.req : INV_KEY;
function invState() {
  if (S.f.only) { if (!S.f.items) S.f.items = {}; return S.f.items; }
  if (!S.inv || S.invKey !== invKey()) { const d = store.get(invKey()); S.inv = (d && d.items) ? d : { started: today(), items: {} }; S.invKey = invKey(); }
  return S.inv.items;
}
function invPersist() { if (!S.f.only && S.inv) store.set(S.invKey, S.inv); }
const myReq = id => { const d = S.demandes && S.demandes[id]; return d && d.statut === "ouverte" && S.me && d.userId === S.me.id ? d : null; };
const blind = () => !isDec();   // les opérateurs comptent sans voir le stock théorique
function invItem(pid) {
  const items = invState(), p = S.produits[pid];
  if (!items[pid]) items[pid] = { mode: +p.contenance > 0 ? "bidons" : "direct", full: 0, open: [], direct: "", done: false };
  return items[pid];
}
function invCalc(pid) {
  const p = S.produits[pid], it = invState()[pid];
  if (!p || !it || !it.done) return null;
  const u = U(p);
  if (it.mode === "direct") {
    const v = parseN(it.direct);
    if (!(v >= 0)) return null;
    return { q: v, detail: fmtN(v) + " " + u + " comptés (saisie directe)" };
  }
  const c = +p.contenance;
  if (!(c > 0)) return null;
  const q = Math.round(((it.full || 0) * c + (it.open || []).reduce((s, x) => s + x, 0) / 100 * c) * 1000) / 1000;
  const parts = [];
  const e = fem(p) ? "e" : "";
  if (it.full) parts.push(it.full + " " + ctw(p, it.full) + " plein" + e + (it.full > 1 ? "s" : ""));
  if (it.open.length) parts.push(it.open.length + " entamé" + e + (it.open.length > 1 ? "s" : "") + " (" + it.open.map(x => x + " %").join(", ") + ")");
  const detail = (parts.length ? parts.join(" + ") : "aucun" + e + " " + ctw(p)) + " de " + fmtN(c) + " " + u + " ≈ " + fmtN(q) + " " + u;
  return { q, detail };
}
function invCard(pid) {

  h += '<div class="row" style="align-items:flex-start"><div><div style="font-weight:700;font-size:18px">' + esc(p.nom) + "</div>" +
    '<div class="muted" style="font-size:14px">' + (blind() ? "" : "Stock théorique : <b>" + fmtN(st) + " " + esc(u) + "</b> · ") + (c > 0 ? ctw(p) + " de " + fmtN(c) + " " + esc(u) : "") +
    (p.invLe ? "<br>Dernier inventaire : " + fmtDate(p.invLe) : "") + "</div></div>" +
    (it.done ? '<button class="btn sm ghost" style="flex:none" data-a="invUndo" data-id="' + esc(pid) + '">Annuler</button>' : "") + "</div>";
  if (c > 0) h += '<div class="seg" style="margin-top:10px"><button data-a="invMode" data-id="' + esc(pid) + '" data-m="bidons" class="' + (it.mode === "bidons" ? "on" : "") + '">' + cap(ctP(p)) + '</button><button data-a="invMode" data-id="' + esc(pid) + '" data-m="direct" class="' + (it.mode === "direct" ? "on" : "") + '">' + (u === "kg" ? "Kilos" : "Litres") + "</button></div>";
  if (it.mode === "bidons" && c > 0) {
    h += '<div class="row" style="margin-top:12px;align-items:center"><b>' + cap(ctP(p)) + (fem(p) ? " pleines" : " pleins") + '</b><div class="stepper" style="flex:none;gap:6px">' +
      '<button style="width:52px;min-height:52px;font-size:26px" data-a="invFull" data-id="' + esc(pid) + '" data-d="-1">−</button>' +
      '<input style="width:70px;min-height:52px;font-size:24px" readonly value="' + (it.full || 0) + '">' +

    h += '<div style="margin-top:12px"><b>' + cap(ctP(p)) + (fem(p) ? " entamées" : " entamés") + '</b> <small class="muted">(niveau estimé à l\'œil)</small></div><div class="chips" style="margin:8px 0">' +
      it.open.map((x, i) => '<button class="chip" data-a="invDelOpen" data-id="' + esc(pid) + '" data-i="' + i + '">' + x + " % ≈ " + fmtN(x / 100 * c) + " " + esc(u) + " ✕</button>").join("") +
      '<button class="chip on" data-a="invAddOpen" data-id="' + esc(pid) + '">+ ' + cap(ctw(p)) + (fem(p) ? " entamée" : " entamé") + '</button></div>';
  } else {

    h += '<div class="row" style="margin-top:10px"><input class="in" inputmode="decimal" placeholder="Quantité totale (' + esc(u) + ')" data-invdirect="' + esc(pid) + '" value="' + esc(it.direct) + '"></div>';
  }
  if (!it.done) h += '<div style="margin-top:10px"><button class="btn sm" data-a="invZero" data-id="' + esc(pid) + '">Aucun en stock (0)</button></div>';
  if (r && blind()) h += '<div class="note ok" style="margin:10px 0 0">Compté ≈ <b>' + fmtN(r.q) + " " + esc(u) + "</b></div>";
  else if (r) {

      (Math.abs(d) < 1e-9 ? "conforme" : "écart <b>" + (d > 0 ? "+" : "") + fmtN(d) + " " + esc(u) + "</b>") + "</div>";
  }
  return h + "</div>";
}
function invRefresh(pid) {

function invCounted() { return Object.keys(invState()).filter(pid => S.produits[pid] && invCalc(pid)); }
function invFooter() {
  const el = $("#inv_foot"); if (!el) return;

  el.innerHTML = '<button class="btn pri full" data-a="invValidate" ' + (n ? "" : "disabled") + ">" + (S.f.req ? "Envoyer le comptage (" : "Valider " + (S.f.only ? "le comptage" : "l'inventaire (")) + (S.f.only ? "" : n + " produit" + (n > 1 ? "s" : "") + ")") + "</button>";
}
function invList() {
  const el = $("#inv_list"); if (!el) return;
  const q = norm(S.f.q);
  let ps = S.f.only ? [[S.f.only, S.produits[S.f.only]]].filter(x => x[1]) : activeProducts();
  if (S.f.req) { const d = S.demandes[S.f.req]; if (d && d.produits) ps = ps.filter(([id]) => d.produits.includes(id)); }
  if (q) ps = ps.filter(([, p]) => norm(p.nom).includes(q) || (p.eans || []).some(e => e.includes(q)));
  if (S.f.flt === "todo") ps = ps.filter(([id]) => !(invState()[id] && invState()[id].done));
  el.innerHTML = ps.length ? ps.map(([id]) => invCard(id)).join("") : '<div class="note info">Aucun produit.</div>';
  invFooter();

  const ok = await modal("<h3>" + (S.f.req ? "Envoyer le comptage ?" : "Valider l'inventaire ?") + "</h3><p class=\"muted\">" + rows.length + " produit(s) compté(s)" + (blind() ? "." : ", " + ecarts.length + " correction(s) de stock.") + "</p>" +
    '<div style="max-height:45vh;overflow:auto">' + list + '</div><div class="acts"><button class="btn" data-m="cancel">Revenir</button><button class="btn pri" data-m="ok">Valider</button></div>');

    const p = S.produits[x.produitId] || { nom: x.nom }, d = parseN(x.dose);

  let eauCuve = eauCalc;

}

let leafletP = null;

const IGN_URL = (layer, fmt) => "https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=" + layer + "&STYLE=normal&FORMAT=" + fmt + "&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}";
let MAPS = [];
function killMaps() { for (const m of MAPS) { try { m.remove(); } catch (e) {} } MAPS = []; }
function makeMap(el) {
  const map = L.map(el, { maxZoom: 21, zoomSnap: 0.5, tap: true }).setView([46.6, 2.4], 6);  // vue initiale obligatoire avant d'ajouter des formes
  const ortho = L.tileLayer(IGN_URL("ORTHOIMAGERY.ORTHOPHOTOS", "image/jpeg"), { maxNativeZoom: 19, maxZoom: 21, attribution: "© IGN – Géoplateforme" });
  const plan = L.tileLayer(IGN_URL("GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2", "image/png"), { maxNativeZoom: 19, maxZoom: 21, attribution: "© IGN – Géoplateforme" });

  L.control.scale({ imperial: false }).addTo(map);

/* Surface géodésique (m²) d'un polygone [[lat, lon], ...] */
function geoArea(pts) {
  if (!pts || pts.length < 3) return 0;
  const R = 6378137, r = Math.PI / 180; let a = 0;
  for (let i = 0; i < pts.length; i++) { const p1 = pts[i], p2 = pts[(i + 1) % pts.length]; a += (p2[1] - p1[1]) * r * (2 + Math.sin(p1[0] * r) + Math.sin(p2[0] * r)); }

const parcPoint = p => (p && p.geom && p.geom.length >= 3) ? geoCenter(p.geom) : (p && p.lat != null && p.lon != null ? [+p.lat, +p.lon] : null);
const ENT_COLORS = ["#2e6a39", "#1f5fa8", "#a15c00", "#8e2a8e", "#b42318", "#0f766e", "#5b4b8a"];
function entColor(eid) { const ids = Object.keys(S.entreprises || {}).sort(); const i = ids.indexOf(eid); return i < 0 ? "#555" : ENT_COLORS[i % ENT_COLORS.length]; }

/* ---- Dessin du contour dans la fiche parcelle ---- */
const DRAW = { map: null, poly: null, line: null, marks: [], on: false };

  DRAW.marks.forEach(m => m.remove()); DRAW.marks = [];

  if (g.length >= 3) DRAW.poly = L.polygon(g, { color: "#ffd400", weight: 3, fillOpacity: 0.2 }).addTo(map);
  else if (g.length === 2) DRAW.poly = L.polyline(g, { color: "#ffd400", weight: 3 }).addTo(map);
  g.forEach((pt, i) => {
    const m = L.marker(pt, { draggable: true, icon: L.divIcon({ className: "vtx", iconSize: [18, 18] }) }).addTo(map);
    m.on("drag", ev => { const ll = ev.target.getLatLng(); g[i] = [+ll.lat.toFixed(7), +ll.lng.toFixed(7)]; if (DRAW.poly) DRAW.poly.setLatLngs(g); drawInfo(); });
    m.on("dragend", () => drawRefresh());

function drawInfo() {
  const el = $("#pa_draw_info"); if (!el) return;
  const g = S.f.geom || [], ha = geoArea(g) / 10000;
  const surf = parseN(($("#pa_surf") || {}).value);
  el.innerHTML = DRAW.on ? "<b>Mode dessin</b> : touchez la carte pour poser les coins de la parcelle, dans l'ordre. Faites glisser un point pour le déplacer." :
    (g.length >= 3 ? "Contour : " + g.length + " points" : "Pas encore de contour.");
  if (g.length >= 3) el.innerHTML += '<br>Surface dessinée : <b>' + fmtN(ha) + " ha</b>" + (surf > 0 && Math.abs(surf - ha) / surf > 0.05 ? ' <span style="color:var(--warn)">(saisie : ' + fmtN(surf) + " ha)</span>" : "") +
    ' <button class="btn sm" data-a="drawUseSurf">Utiliser cette surface</button>';
  const bt = $("#pa_draw_btn"); if (bt) { bt.textContent = DRAW.on ? "✅ Terminer le dessin" : (g.length ? "✏️ Modifier le contour" : "✏️ Dessiner le contour"); bt.classList.toggle("pri", DRAW.on); }
}
async function parcMapInit() {
  const el = $("#pa_map"); if (!el) return;
  try { await loadLeaflet(); } catch (e) { el.innerHTML = '<div class="note warn" style="margin:0">' + esc(e.message) + "</div>"; return; }
  if (!document.body.contains(el)) return;
  const map = makeMap(el); DRAW.map = map; DRAW.on = false; DRAW.poly = null; DRAW.marks = [];
  const others = drawParcels(map, { exclude: S.f.pid, color: () => "#ffffff", fiche: false });
  others.forEach(l => l.setStyle({ color: "#ffffff", weight: 1.5, fillOpacity: 0.08, dashArray: "4 4" }));
  const p = S.f.pid ? S.parcelles[S.f.pid] || {} : {};
  if (S.f.geom === undefined) S.f.geom = p.geom ? p.geom.map(x => [x[0], x[1]]) : [];
  drawRefresh();
  if (S.f.geom.length >= 3) map.fitBounds(L.polygon(S.f.geom).getBounds(), { padding: [30, 30], maxZoom: 19 });
  else if (p.lat != null && p.lon != null) map.setView([+p.lat, +p.lon], 17);

    const ll = [pos.coords.latitude, pos.coords.longitude];
    map.setView(ll, zoom || 18);
    L.circleMarker(ll, { radius: 7, color: "#1f5fa8", fillColor: "#1f5fa8", fillOpacity: 0.9 }).addTo(map);
  }, err => toast("Position refusée ou indisponible : " + err.message, "err", 5000), { enableHighAccuracy: true, timeout: 20000 });
}

/* ---- Carte dans l'ordre de traitement ---- */
async function trtMapInit(t) {
  const el = $("#trt_map"); if (!el) return;
  try { await loadLeaflet(); } catch (e) { el.remove(); return; }
  if (!document.body.contains(el)) return;
  const ids = (t.data.parcelles || []).map(p => p.id);
  const map = makeMap(el);
  const done = (t.data.realise && t.data.realise.parcelles) || null;
  fitTo(map, drawParcels(map, { only: ids, showOthers: true, labels: true, color: id => (done && !done.includes(id)) ? "#999" : "#ffd400" }), null);
}

async function saveParc() {
  // si la carte n'a pas pu s'afficher, on garde le contour existant
  const geom = S.f.geom === undefined ? (((S.parcelles || {})[S.f.pid] || {}).geom || null) : (S.f.geom.length >= 3 ? S.f.geom : null);
  if (geom && !$("#pa_lat").value.trim() && !$("#pa_lon").value.trim()) { const c = geoCenter(geom); $("#pa_lat").value = c[0].toFixed(7); $("#pa_lon").value = c[1].toFixed(7); }
  if (geom && !parseN($("#pa_surf").value)) $("#pa_surf").value = String(Math.round(geoArea(geom) / 100) / 100).replace(".", ",");
  const surf = parseN($("#pa_surf").value);
  if (!$("#pa_nom").value.trim()) return toast("Indiquez le nom.", "err");
  if (!(surf > 0)) return toast("Indiquez la surface en hectares.", "err");
  const taux = $("#pa_taux").value.trim() === "" ? 100 : parseN($("#pa_taux").value);
  if (!(taux > 0 && taux <= 100)) return toast("Taux de remplissage : entre 1 et 100 %.", "err");
  const lat = parseN($("#pa_lat").value), lon = parseN($("#pa_lon").value);
  let oepp = $("#pa_oepp").value.trim().toUpperCase();
  if (!oepp && OEPP[norm($("#pa_cult").value)]) oepp = OEPP[norm($("#pa_cult").value)];
  const r = await act("save_parcelle", { p_id: S.f.pid || null, p_nom: $("#pa_nom").value, p_surface: surf, p_culture: $("#pa_cult").value, p_variete: $("#pa_var").value,
    p_notes: $("#pa_notes").value, p_actif: S.f.pid ? $("#pa_act").checked : true,
    p_ilot: $("#pa_ilot").value, p_num_parcelle: $("#pa_num").value, p_insee: $("#pa_insee").value,
    p_lat: isFinite(lat) ? lat : null, p_lon: isFinite(lon) ? lon : null, p_code_oepp: oepp, p_bio: $("#pa_bio").checked,
    p_entreprise_id: $("#pa_ent").value || null, p_geom: geom, p_taux: taux }, "Parcelle enregistrée");
  if (!r) return;
  const back = S.f.back || "parcs";
  if (back === "trtnew") { const o = S._oDraft || null; S._oDraft = null; if (o && r.r) o.parc[r.r] = true; return go("trtnew", o ? { o } : {}); }
  const [v, bpid] = back.split(":"); go(v, bpid ? { pid: bpid } : {});
}

async function oSend() {

    pulve: o.kind === "diff" ? null : { id: o.pulve, nom: pv.nom, capacite: +pv.capacite },

    calc: { surf: c.surf, seff: c.seff, V: c.V, cap: c.cap, B: c.B, Bcalc: c.Bcalc, n: c.n, bCuve: c.bCuve, eauCuve: c.eauCuve, eauCalc: c.eauCalc, Vreel: c.Vreel, warns: c.warns }

function calcFromSaved(t) {
  const d = t.data, c = d.calc || {};
  if (d.type === "diffuseurs") return { diff: true, ok: true, errs: [], warns: c.warns || [], surf: c.surf, seff: c.surf, n: 0, prods: (d.produits || []).map(p => ({ ...p, qhaApplique: p.qha })) };
  return { ok: true, errs: [], warns: c.warns || [], surf: c.surf, seff: c.seff, V: c.V, cap: c.cap, B: c.B, n: c.n, bCuve: c.bCuve, eauCuve: c.eauCuve,
    prods: (d.produits || []).map(p => ({ ...p, qhaApplique: p.qha * (d.r2 ? 0.5 : 1) })) };
}

function regText(p) {
  const r = regStatus(p);
  if (r.k === "banned") return "INTERDIT depuis le " + fmtDate(r.date) + " (à éliminer, PPNU)";
  if (r.k === "soon" || r.k === "warn" || r.k === "ending") return "Fin d'utilisation le " + fmtDate(r.date);
  if (r.k === "retire") return "AMM retirée";
  if (r.k === "ok") return "Autorisé" + (r.usages.length ? " (" + r.usages.length + " usage(s) en fin)" : "");

function histoRows() {
  const f = S.f, q = norm(f.hq);
  return Object.entries(S.mouvements).filter(([, m]) => m &&
    (!q || norm(m.produitNom).includes(q)) && (!f.ht || m.type === f.ht) && (!f.hp || m.prenom === f.hp) &&
    (!f.hd1 || m.date >= f.hd1) && (!f.hd2 || m.date <= f.hd2)).sort(sortMv);
}
function renderHisto() {
  const el = $("#hlist"); if (!el) return;
  const rows = histoRows(), shown = rows.slice(0, 300);
  el.innerHTML = rows.length ? '<p class="muted" style="font-size:13px;margin:0 2px 8px">' + rows.length + " mouvement(s)" + (rows.length > 300 ? " — 300 premiers affichés" : "") + '</p><div class="list">' + shown.map(([id, m]) => mvRow(id, m, isDec())).join("") + "</div>"
    : '<div class="note info">Aucun mouvement.</div>';
}
function csvText() {
  const c = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const lines = [["Date", "Type", "Produit", "Quantité", "Unité", "Contenants", "Personne", "Certiphyto", "Note"].map(c).join(";")];
  for (const [, m] of histoRows()) {
    const q = m.type === "sortie" ? -m.quantite : m.quantite;
    lines.push([fmtDate(m.date), m.type === "entree" ? "Entrée" : m.type === "sortie" ? "Sortie" : "Inventaire", m.produitNom, String(q).replace(".", ","), m.unite, m.nbBidons ?? "", m.prenom, m.certiphyto, m.note].map(c).join(";"));
  }
  return lines.join("\r\n");
}
async function copyCsv() {
  const txt = csvText();
  try { await navigator.clipboard.writeText(txt); toast("Copié. Collez dans Excel."); }
  catch (e) { modal('<h3>Copier le CSV</h3><textarea class="in" style="height:220px;font-size:12px">' + esc(txt) + '</textarea><div class="acts"><button class="btn" data-m="cancel">Fermer</button></div>'); }
}
function dlCsv() {
  const blob = new Blob(["﻿" + csvText()], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "stock-phyto-" + today() + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function delMv(id) {

}

    h += '<label class="f">Rôle</label><div class="seg" id="u_role"><button data-a="urole" data-r="applicateur" class="' + (r === "applicateur" ? "on" : "") + '">Applicateur</button><button data-a="urole" data-r="decideur" class="' + (r === "decideur" ? "on" : "") + '">Décideur</button></div>';
    h += '<p class="muted" style="font-size:13px">' + (r === "decideur" ? "Décideur : réceptions, sorties, commandes, alertes, corrections, historique." : "Applicateur : sorties de produit et consultation du stock.") + "</p>";
    h += '<label class="f">N° de certificat Certiphyto</label><input class="in" id="u_cert" value="' + esc(u.certiphyto || "") + '">';
    h += '<label class="f">Code ' + (id ? "<small>(laisser vide pour ne pas changer)</small>" : "<small>(4 à 6 chiffres)</small>") + '</label><input class="in" id="u_code" inputmode="numeric" maxlength="6" autocomplete="off">';
    if (id) h += '<label class="tog"><span><b>Compte actif</b><br><small class="muted">Désactiver empêche la connexion, l\'historique est conservé</small></span><input type="checkbox" id="u_act" ' + (u.actif !== false ? "checked" : "") + "></label>";
    h += '<div style="margin-top:16px"><button class="btn pri full" data-a="saveUser">Enregistrer</button></div>';
    if (id && id !== S.me.id) h += '<div class="foot"><button class="btn ghost" style="color:var(--bad)" data-a="delUser">🗑 Supprimer ce compte</button><p class="muted" style="font-size:13px">L\'historique (sorties, inventaires, registre) reste lisible : le prénom et le n° Certiphyto y sont recopiés sur chaque ligne.</p></div>';
    return h;
  }
};
async function saveUser() {
  const isNew = !S.f.uid;
  const prenom = $("#u_pre").value.trim(), cert = $("#u_cert").value.trim(), code = $("#u_code").value.trim();
  if (!prenom) return toast("Indiquez le prénom.", "err");
  if (!cert) return toast("Indiquez le n° de certificat Certiphyto.", "err");
  if ((isNew || code) && !/^\d{4,6}$/.test(code)) return toast("Le code doit faire 4 à 6 chiffres.", "err");
  const ok = await act("save_user", { p_id: S.f.uid || null, p_prenom: prenom, p_role: $("#u_role .on").dataset.r, p_certiphyto: cert, p_code: code || null, p_actif: isNew ? true : $("#u_act").checked },
    isNew ? "Utilisateur créé : " + prenom : "Enregistré");
  if (ok) go("users");
}

/* ===================== Actions (clics) ===================== */
const A = {
  go: d => { const [v, pid] = String(d.v).split(":"); go(v, (pid || d.pid) ? { pid: pid || d.pid } : {}); },
  retry: () => boot(),
  doSetup: () => doSetup(),
  who: d => go("code", { uid: d.id, name: d.n, code: "" }),
  key: d => keyPress(d.k),
  logout: () => logout(),
  startPick: d => go("pick", { mode: d.m, q: "" }),
  pickp: d => { if (S.view === "stock") return go("produit", { pid: d.id }); pickProduct(d.id); },
  scanPick: () => scan(code => handleBarcode(code)),
  unknown: () => go("inconnu", { nom: isCode(S.f.q) ? "" : (S.f.q || ""), ean: S.f.unknownEan || "" }),
  newprodFromPick: () => go("newprod", { nom: isCode(S.f.q) ? "" : (S.f.q || ""), ean: isCode(S.f.q) ? S.f.q.trim() : "", then: "entree" }),
  unit: d => { S.f.unit = d.u; render(); },
  step: d => { const v = parseN(S.f.n); S.f.n = String(Math.max(0, (isFinite(v) ? v : 0) + (+d.d))); $("#n").value = S.f.n; updQty(); },
  saveQty: () => saveQty(),
  sendUnknown: () => sendUnknown(),
  punit: (d, b) => { b.parentNode.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); },
  scanEan: () => scan(code => { const el = $("#p_ean"); if (!el) return; const cur = el.value.split(/[,;\s]+/).filter(Boolean); if (!cur.includes(code)) cur.push(code); el.value = cur.join(", "); toast("Code-barre ajouté : " + code); }),
  createProduct: () => createProduct(),
  saveProduct: () => saveProduct(),
  doInventory: () => doInventory(),
  archiveProduct: () => archiveProduct(),
  deleteProductForever: () => deleteProductForever(),
  orderOn: d => setOrder(d.id, true).then(() => render()),
  orderOff: d => setOrder(d.id, false).then(() => render()),
  flt: d => { S.f.flt = d.k; render(); },
  assoc: d => go("pick", { mode: "assoc", alertId: d.id, q: (S.alertes[d.id] || {}).nomSaisi || "" }),
  resolve: d => resolveAlert(d.id),
  copyCsv: () => copyCsv(),
  dlCsv: () => dlCsv(),
  delMv: d => delMv(d.id),
  editUser: d => go("useredit", { uid: d.id }),
  urole: d => { S.f.role = d.r; const keep = { pre: $("#u_pre").value, cert: $("#u_cert").value, code: $("#u_code").value }; render(); $("#u_pre").value = keep.pre; $("#u_cert").value = keep.cert; $("#u_code").value = keep.code; },
  saveUser: () => saveUser(),
  ephySearch: () => ephySearch(),
  ephyAuto: () => ephyAuto(),
  invOne: d => go("inv", { only: d.id }),
  invFlt: d => { S.f.flt = d.k; render(); },
  invMode: d => { invItem(d.id).mode = d.m; invRefresh(d.id); },
  invFull: d => { const it = invItem(d.id); it.full = Math.max(0, (it.full || 0) + (+d.d)); it.done = true; invRefresh(d.id); },
  invAddOpen: d => invPickPct(d.id),
  invDelOpen: d => { const it = invItem(d.id); it.open.splice(+d.i, 1); invRefresh(d.id); },
  invZero: d => { const it = invItem(d.id); it.full = 0; it.open = []; it.direct = "0"; it.done = true; invRefresh(d.id); },
  invUndo: d => { delete invState()[d.id]; invRefresh(d.id); },
  invRestart: async () => { if (!await confirmBox("Tout recommencer ?", "Les comptages saisis sur cet appareil seront effacés (rien n'a encore été enregistré dans le stock).", "Recommencer", true)) return; S.inv = null; store.del(INV_KEY); render(); },
  invValidate: () => invValidate(),
  invScan: () => scan(code => invGotCode(code)),
  goReq: d => go("inv", { req: d.id }),
  saveParc: () => saveParc(),
  parcGps: () => {
    if (!navigator.geolocation) return toast("Position indisponible sur cet appareil.", "err");
    toast("Recherche de la position…");
    navigator.geolocation.getCurrentPosition(pos => { $("#pa_lat").value = pos.coords.latitude.toFixed(7); $("#pa_lon").value = pos.coords.longitude.toFixed(7); toast("Position relevée (précision ≈ " + Math.round(pos.coords.accuracy) + " m)."); },
      err => toast("Position refusée ou indisponible : " + err.message, "err", 5000), { enableHighAccuracy: true, timeout: 20000 });
  },
  regCsv: () => regCsv(),
  regDel: d => regDel(d.id),
  regManSave: () => regManSave(),
  saveEnt: () => saveEnt(),
  entEdit: () => { S.f.edit = !S.f.edit; render(); },
  entParc: d => go("parc", { pid: d.id, back: "ent:" + S.f.pid }),
  entAddParc: () => go("parc", { ent: S.f.pid, back: "ent:" + S.f.pid }),
  entOrder: () => go("trtnew", { o: { date: today(), op: "", parc: {}, pulve: "", vha: "", r2: false, prods: [], note: "", bbch: "", cible: "", mode: "Pulvérisation", sb: "", ent: S.f.pid, horaires: false } }),
  oNewParc: () => { S._oDraft = trtOrder(); go("parc", { ent: S._oDraft.ent, back: "trtnew" }); },
  drawToggle: () => { DRAW.on = !DRAW.on; if (DRAW.map) DRAW.map.getContainer().style.cursor = DRAW.on ? "crosshair" : ""; drawInfo(); },
  drawUndo: () => { (S.f.geom || []).pop(); drawRefresh(); },
  drawClear: async () => { if (!(S.f.geom || []).length) return; if (!await confirmBox("Effacer le contour ?", "Les points dessinés seront supprimés (rien n'est enregistré tant que vous ne touchez pas Enregistrer).", "Effacer", true)) return; S.f.geom = []; drawRefresh(); },
  drawLocate: () => { if (DRAW.map) locateOn(DRAW.map, 18); },
  drawUseSurf: () => { const ha = geoArea(S.f.geom || []) / 10000; $("#pa_surf").value = String(Math.round(ha * 100) / 100).replace(".", ","); drawInfo(); toast("Surface mise à jour : " + fmtN(ha) + " ha (pensez à enregistrer)."); },
  mapLocate: () => { if (S._mapAll) locateOn(S._mapAll, 17); },
  delUser: async () => { const u = S.users[S.f.uid] || {};
    if (!await confirmBox("Supprimer le compte de " + (u.prenom || "?") + " ?", "Suppression définitive : la personne ne pourra plus se connecter. Son historique reste dans l'appli. Ses ordres de traitement à faire passent à « n'importe quel opérateur ».", "Supprimer", true)) return;
    if (await act("delete_user", { p_id: S.f.uid }, "Compte supprimé")) go("users"); },
  clNew: async () => { const r = await modal('<h3>Commander un nouveau produit</h3><p class="muted">Il sera créé dans l\'appli à sa livraison.</p><label class="f">Nom du produit</label><input class="in" data-mi placeholder="Nom commercial"><label class="f">Note <small>(facultatif)</small></label><input class="in" id="cl_note" placeholder="fournisseur, quantité, date prévue…"><div class="acts"><button class="btn" data-m="cancel">Annuler</button><button class="btn pri" data-m="ok">Valider</button></div>');
    if (!r) return; const note = S._clNote || ""; S._clNote = "";
    if (!(r.input || "").trim()) return toast("Indiquez le nom du produit.", "err");
    if (await act("cmd_libre_creer", { p_nom: r.input, p_note: note }, "Commande notée — visible par tous les décideurs")) go("commandes"); },
  clOff: async d => { if (!await confirmBox("Retirer cette commande ?", "", "Retirer", true)) return; await act("cmd_libre_statut", { p_id: d.id, p_statut: "annulee" }, "Commande retirée"); },
  clRecv: d => { const c = S.cmdLibres[d.id]; go("newprod", { nom: c ? c.nom : "", then: "entree", cmdLibre: d.id }); },
  savePulv: () => savePulv(),
  oKind: d => { const o = trtOrder(); if (o.kind === d.k) return; o.kind = d.k; o.prods = []; o.mode = d.k === "diff" ? "Pose de diffuseurs" : "Pulvérisation"; render(); },
  oPulve: d => { const o = trtOrder(); o.pulve = d.id; const pv = S.pulves[d.id]; if (pv && pv.volumeHa && !String(o.vha).trim()) o.vha = String(pv.volumeHa); render(); },
  oAddProd: () => oAddProd(),
  oDelProd: d => { trtOrder().prods.splice(+d.i, 1); render(); },
  oSend: () => oSend(),
  trtDone: () => trtDone(),
  trtCopy: () => trtCopy(),
  trtCancel: () => trtCancel(),
  rqUser: d => { S.f.ech = ($("#rq_ech") || {}).value || S.f.ech; S.f.note = ($("#rq_note") || {}).value || S.f.note; S.f.uid = d.id; render(); },
  rqScope: d => { S.f.ech = ($("#rq_ech") || {}).value || S.f.ech; S.f.note = ($("#rq_note") || {}).value || S.f.note; S.f.scope = d.k; render(); },
  rqAll: () => { activeProducts().forEach(([id]) => S.f.sel[id] = true); render(); },
  rqNone: () => { S.f.sel = {}; render(); },
  rqSend: () => rqSend(),
  rqCancel: async d => { if (!await confirmBox("Annuler cette demande ?", "L'opérateur ne la verra plus. Les comptages qu'il aurait commencés ne seront pas enregistrés.", "Annuler la demande", true)) return; act("inv_demande_statut", { p_id: d.id, p_statut: "annulee" }, "Demande annulée"); },
  rqSeen: d => act("inv_demande_statut", { p_id: d.id, p_statut: "vue" }),
  histoInv: d => go("histo", { ht: "ajustement", hp: d.n }),
  doPrint: () => { try { window.print(); } catch (e) { toast("Impression impossible sur cet appareil.", "err"); } }
};
document.addEventListener("input", e => { if (e.target.id === "cl_note") S._clNote = e.target.value; });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]");
  if (!b || b.closest("#modal")) return;
  const fn = A[b.dataset.a];
  if (fn) { e.preventDefault(); fn(b.dataset, b); }
});

boot();
</script>
</body>
</html>
